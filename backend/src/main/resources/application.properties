spring.application.name=school-fee

# --- Datasource -------------------------------------------------------------
# Local PostgreSQL. Override any of these with the matching SPRING_DATASOURCE_*
# environment variable rather than editing this file per machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/school_fee
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA --------------------------------------------------------------------
# Liquibase owns the schema; Hibernate only validates that the entities and the
# migrated tables still agree, so a drifted mapping fails at startup instead of
# at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Liquibase --------------------------------------------------------------
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# --- JSON -------------------------------------------------------------------
# Jackson 3 (Boot 4) already writes java.time values as ISO-8601 strings, which
# is what the admin UI needs 'new Date()' to be able to parse; only the zone
# has to be pinned so timestamps do not shift with the server default.
spring.jackson.time-zone=UTC

# --- Security ---------------------------------------------------------------
# HMAC key the access tokens are signed with. HS256 needs at least 32 bytes and
# the application refuses to start with less. The value below is a development
# default and is in version control, which is exactly why every deployment must
# override it with APP_SECURITY_JWT_SECRET: anyone holding this string can
# mint a token for any account.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
app.security.jwt.issuer=school-fee
# Short, because nothing can revoke an access token before it expires: this is
# how long a role change or a disabled account takes to actually bite.
app.security.jwt.access-token-ttl=15m
# How long a session survives without signing in again. Rotated on every use.
app.security.jwt.refresh-token-ttl=7d

# --- CORS -------------------------------------------------------------------
# The Vite dev server. Add origins as a comma-separated list.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176

# --- HTTP connector ---------------------------------------------------------
# Square brackets are legal here because Refine's data provider sends them:
# `getMany` builds `?ids[0]=1&ids[1]=2` through qs, which encodes values but not
# keys, and the browser's URL parser leaves `[` and `]` alone in a query string.
#
# Tomcat rejects them by default -- they are gen-delims that RFC 3986 does not
# permit outside a host -- and it does so in the connector, before any filter
# runs. That produces a 400 HTML page with no CORS headers, so the browser
# reports the failure as a CORS error on the preflight and the real cause is
# nowhere in it. `ListParams.ids()` already parses `ids[0]`; the request simply
# never reached it.
#
# Two characters, in the query string only. The path parser is untouched.
server.tomcat.relaxed-query-chars=[,]

# --- Actuator ---------------------------------------------------------------
# Health only, and details only for a caller that authenticated. The row-level
# indicator turns the check DOWN while any policy is quarantined and lists which
# ones -- a policy that is not applying is a security control that is not
# applying, and the whole point of quarantining rather than refusing to start is
# that it must not then be invisible. Without details the check says DOWN and
# nothing else, which is a page at 3am with nowhere to go.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# --- Thông báo thu tiền -----------------------------------------------------
# E-mail goes out through SMTP (Gmail by default, as in the previous application).
# The account and its app password are NOT in this file: they live in
# backend/config/application.properties (ignored by git) or in the environment as
# SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD. Without them the notification can be
# written and scheduled, and each recipient fails with "SMTP chưa được cấu hình".
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Where the money goes: the bank account named in the e-mail and the VietQR image that
# carries it. The order code prefix starts every transfer description, so a bank line can
# be matched to its payment request.
school-fee.payment.bank-account.number=0000000002
school-fee.payment.bank-account.bank=BIDV
school-fee.payment.bank-account.holder=CONG TY TNHH TEST DD2B
school-fee.payment.viet-qr.base-url=https://vietqr.app/img
school-fee.payment.viet-qr.template=compact
school-fee.payment.viet-qr.show-info=0
school-fee.payment.order-code-prefix=NBK

# How the sending behaves. Recipients are sent in chunks of this size, and the counters the
# list shows are refreshed after each chunk. The poll interval is how soon a notification
# scheduled for "now" is picked up.
school-fee.notification.dispatch-batch-size=100
school-fee.notification.time-zone=Asia/Ho_Chi_Minh
school-fee.notification.poll-interval-ms=5000
school-fee.notification.dispatch-enabled=true
school-fee.notification.sender-unit=Phòng Kế toán – Tài vụ
