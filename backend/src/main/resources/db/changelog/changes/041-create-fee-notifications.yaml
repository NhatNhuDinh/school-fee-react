# Thông báo thu tiền: one email per student, sent in the background, for a đợt thu.
#
#   fee_payment_requests            the transfer a student is asked to make: an order code that
#                                   goes in the bank transfer, the amount and a snapshot of the
#                                   bank account it is to be paid into. Created with the
#                                   notification (draft) and made payable when it is scheduled;
#                                   the counter screen will use the same table.
#   fee_notifications               the đợt thông báo: subject, text, deadline, when it goes out,
#                                   and the counters its list reads
#   fee_notification_recipients     one row per student, frozen when the notification is made
#                                   (name, class, e-mail, the khoản thu owed), so what was sent
#                                   is what is on record even if the student changes later
#
# A notification belongs to its đợt: the đợt cannot be deleted from under it (RESTRICT) and
# its recipients and payment requests go with the notification (CASCADE).
databaseChangeLog:
  - changeSet:
      id: 041-create-fee-notifications
      author: school-fee
      changes:
        - createTable:
            tableName: fee_payment_requests
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fee_payment_requests
              - column:
                  name: organization_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_payment_requests_organization
                    references: organizations(id)
              - column:
                  name: academic_year_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_payment_requests_academic_year
                    references: academic_years(id)
              - column:
                  name: batch_student_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_payment_requests_batch_student
                    references: fee_collection_batch_students(id)
                    deleteCascade: true
              - column:
                  name: order_code
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_fee_payment_requests_order_code
              - column:
                  name: requested_amount
                  type: numeric(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency_code
                  type: varchar(3)
                  defaultValue: VND
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(30)
                  defaultValue: VIET_QR
                  constraints:
                    nullable: false
              - column:
                  name: bank_account_number
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: bank_code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: bank_account_holder
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: viet_qr_base_url
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: viet_qr_template
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: viet_qr_show_info
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: deadline
                  type: date
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: fee_payment_requests
            indexName: ix_fee_payment_requests_batch_student
            columns:
              - column:
                  name: batch_student_id
        - createTable:
            tableName: fee_notifications
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fee_notifications
              - column:
                  name: organization_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_notifications_organization
                    references: organizations(id)
              - column:
                  name: academic_year_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_notifications_academic_year
                    references: academic_years(id)
              - column:
                  name: batch_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_notifications_batch
                    references: fee_collection_batches(id)
              - column:
                  name: subject
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: deadline
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: send_at
                  type: timestamptz
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: recipient_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: sent_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: failed_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: missing_email_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text
              - column:
                  name: created_by_name
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
        - createIndex:
            tableName: fee_notifications
            indexName: ix_fee_notifications_batch
            columns:
              - column:
                  name: batch_id
        - createIndex:
            tableName: fee_notifications
            indexName: ix_fee_notifications_due
            columns:
              - column:
                  name: status
              - column:
                  name: send_at
        - createTable:
            tableName: fee_notification_recipients
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fee_notification_recipients
              - column:
                  name: notification_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_notification_recipients_notification
                    references: fee_notifications(id)
                    deleteCascade: true
              - column:
                  name: batch_student_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fee_notification_recipients_batch_student
                    references: fee_collection_batch_students(id)
                    deleteCascade: true
              - column:
                  name: payment_request_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_fee_notification_recipients_payment_request
                    references: fee_payment_requests(id)
                    deleteCascade: true
              - column:
                  name: student_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: student_code
                  type: varchar(100)
              - column:
                  name: class_group_name
                  type: varchar(255)
              - column:
                  name: class_name
                  type: varchar(255)
              - column:
                  name: guardian_name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(320)
              - column:
                  name: fee_lines_json
                  type: text
              - column:
                  name: total_amount
                  type: numeric(19,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: timestamptz
              - column:
                  name: error_message
                  type: text
        - createIndex:
            tableName: fee_notification_recipients
            indexName: ix_fee_notification_recipients_notification_status
            columns:
              - column:
                  name: notification_id
              - column:
                  name: status
        - createIndex:
            tableName: fee_notification_recipients
            indexName: ix_fee_notification_recipients_batch_student
            columns:
              - column:
                  name: batch_student_id
        - sql:
            sql: >
              ALTER TABLE fee_notifications ADD CONSTRAINT ck_fee_notifications_counts
              CHECK (recipient_count >= 0 AND sent_count >= 0 AND failed_count >= 0 AND missing_email_count >= 0)
            comment: Counters never go negative.
