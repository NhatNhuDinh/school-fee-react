# nginx inside the frontend image. The proxy in front (Nginx Proxy Manager, or
# the browser straight at 10.123.123.174:8113) sends everything here: the
# React files are served from disk, /api/ and /ws go on to the backend.

# TLS ends at the outer proxy, so this server only ever sees http. Pass on the
# scheme the outer proxy reports, falling back to our own when there is none.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    # A redirect built from this server's own scheme and port would send the
    # browser to http:// behind the TLS proxy.
    absolute_redirect off;

    # Ask Docker's DNS every 10 s instead of keeping the IP nginx saw at
    # startup: a deploy recreates the backend container with a new IP. By
    # container name, never the service name: this container is also on the
    # shared app-network, where `backend` resolves to another project's API.
    resolver 127.0.0.11 valid=10s;
    set $backend http://edupay-backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    # STOMP handshake: without the upgrade headers it works locally and fails here
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The live channel can stay quiet for hours; nginx cuts it after 60 s by default
        proxy_read_timeout 3600s;
    }
    # File names carry a content hash, so a new build means new names
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # The only file that points at the new JS names: always revalidated, or a
    # browser keeps asking for files the last deploy removed
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # React Router paths have no file on disk
    location / {
        try_files $uri $uri/ /index.html;
    }
}
